name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate platform inventory
        run: python tools/validate_platform.py

      - name: Validate boot handoff manifest
        run: python tools/validate_boot_handoff.py

      - name: Validate XNULoader platform services
        run: python tools/validate_platform_services.py

      - name: Run XNULoader UI model tests
        run: python -m unittest discover -s tests -p "test_xnuloader_ui_model.py" -v

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
